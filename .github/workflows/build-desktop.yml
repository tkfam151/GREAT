name: Build desktop apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the tested builds as a permanent GitHub Release (tag v<package.json version>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (DMG)
            os: macos-latest
            script: dist:mac
            artifact: Blockhaven-macOS
            files: dist/Blockhaven-*-mac.dmg
          - name: Windows (installer)
            os: windows-latest
            script: dist:win
            artifact: Blockhaven-Windows
            files: dist/Blockhaven-Setup-*.exe
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERTS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Optional: Apple Developer ID signing + notarization, so the Mac app opens without any extra steps.
      # Add repository secrets MAC_CERTS (base64 .p12 "Developer ID Application" certificate), MAC_CERTS_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to enable it. Without them the app is ad-hoc signed.
      - name: Use Apple Developer ID signing
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "CSC_LINK=$MAC_CERTS"
            echo "CSC_KEY_PASSWORD=$MAC_CERTS_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }}
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error



      # ---- Install and launch the real build (runs after upload, so a test failure never blocks the download), then drive it with scripts/smoke-test.mjs ----
      - name: Install and test the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/Blockhaven-*-mac.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          echo "DMG contents:"; ls -la "$MNT"
          if [ "$HAS_MAC_CERT" != "true" ]; then test -f "$MNT/How to open Blockhaven.txt"; fi
          ditto "$MNT/Blockhaven.app" /Applications/Blockhaven.app
          hdiutil detach "$MNT"
          APP=/Applications/Blockhaven.app
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/Blockhaven")"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|flags" || true
          # Simulate a browser download, then apply the documented one-time fix.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$APP"
          xattr -cr "$APP"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "quarantine still present"; exit 1; fi
          "$APP/Contents/MacOS/Blockhaven" --remote-debugging-port=9222 > app.log 2>&1 &
          PID=$!
          node scripts/smoke-test.mjs 9222 smoke-screenshots || { echo "--- app log ---"; tail -50 app.log; kill $PID; exit 1; }
          kill -0 $PID && echo "App still running after the test"
          kill $PID

      - name: Install and test the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\Blockhaven-Setup-*.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Blockhaven\Blockhaven.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 2 | Select-Object FullName; throw "Blockhaven.exe was not installed to $exe" }
          Write-Host "Installed to $exe"
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Blockhaven.lnk'
          Write-Host "Start menu shortcut present: $(Test-Path $shortcut)"
          $proc = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9222','--use-angle=swiftshader','--enable-unsafe-swiftshader' -PassThru
          node scripts/smoke-test.mjs 9222 smoke-screenshots
          $code = $LASTEXITCODE
          if (-not $proc.HasExited) { Write-Host "App still running after the test" }
          Get-Process Blockhaven -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $code

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-screenshots
          path: smoke-screenshots/
          if-no-files-found: ignore


  # Publishes one permanent GitHub Release with both installers, only after both builds pass their install tests.
  # Runs for pushed tags (v*) or a manual "Run workflow" with "release" ticked.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download the Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: Blockhaven-macOS
          path: release-files

      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Blockhaven-Windows
          path: release-files

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          An original voxel sandbox game with a launcher, Survival and Creative modes, inventory and crafting.

          ## Download
          - **Mac** (Apple silicon and Intel): `Blockhaven-${{ steps.ver.outputs.version }}-mac.dmg`
          - **Windows**: `Blockhaven-Setup-${{ steps.ver.outputs.version }}.exe`

          ## Mac: first launch
          Drag Blockhaven into Applications, then paste this into Terminal (needed once per download because the app isn't notarized by Apple):

          ```bash
          pkill -9 -f "Blockhaven"; mkdir -p ~/Applications; rm -rf ~/Applications/Blockhaven.app; ditto --noextattr --noqtn /Applications/Blockhaven.app ~/Applications/Blockhaven.app && codesign --force --deep --sign - ~/Applications/Blockhaven.app && open ~/Applications/Blockhaven.app
          ```

          Afterwards, open Blockhaven from `~/Applications`.

          ## Windows: first launch
          Run the installer. If SmartScreen warns you, click **More info → Run anyway** (the installer isn't code-signed).
          NOTES
          ls -la release-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Blockhaven ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-files/*.dmg
            release-files/*.exe
