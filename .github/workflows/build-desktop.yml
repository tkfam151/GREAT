name: Build desktop apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (DMG)
            os: macos-latest
            script: dist:mac
            artifact: Blockhaven-macOS
            files: dist/Blockhaven-*-mac.dmg
          - name: Windows (installer)
            os: windows-latest
            script: dist:win
            artifact: Blockhaven-Windows
            files: dist/Blockhaven-Setup-*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }}
        run: npm run ${{ matrix.script }}
        env:
          # No paid signing certificates: the Mac app is ad-hoc signed and the Windows installer is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
